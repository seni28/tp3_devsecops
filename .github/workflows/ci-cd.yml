# Ce workflow est déclenché lors d'un push ou d'une Pull Request sur la branche 'main'.
name: CI/CD Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Définition des variables de l'environnement
env:
  DOCKER_IMAGE_NAME: ${{ github.repository }} # Nom de l'image (e.g., user/repo)
  COOLIFY_APP_NAME: 'votre-application-coolify' # Remplacez par le nom de l'application dans Coolify

jobs:
  ################################################################
  # JOB 1: SECURITY SCAN avec BANDIT (Static Analysis Security Testing)
  ################################################################
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        # CORRECTION : Utilisation de -sH et -cH sans espace pour éviter l'erreur de fichier de configuration.
        # N'échoue que sur les alertes HAUTES (Severity/Confidence: H).
        run: |
          echo "Running Bandit security scan..."
          bandit -r . -x ./tests -sH -cH --skip B101,B105