# Ce workflow est déclenché lors d'un push ou d'une Pull Request sur la branche 'main'.
name: CI/CD Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Définition des variables de l'environnement
env:
  DOCKER_IMAGE_NAME: ${{ github.repository }} # Nom de l'image (e.g., user/repo)
  COOLIFY_APP_NAME: 'votre-application-coolify' # Remplacez par le nom de l'application dans Coolify

jobs:
  ################################################################
  # JOB 1: SECURITY SCAN avec BANDIT (Static Analysis Security Testing)
  ################################################################
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        # Exécute Bandit récursivement (r) en excluant les tests, avec un niveau de confiance/sévérité élevé (ll).
        # Ajout de skips communs (B101: assert, B105: hardcoded password string) pour éviter le bruit
        run: |
          echo "Running Bandit security scan..."
          bandit -r . -x ./tests -ll --skip B101,B105

  ################################################################
  # JOB 2: BUILD DOCKER IMAGE + PUSH to GHCR + DEPLOY (Conditionnel)
  ################################################################
  build_and_deploy:
    # Ce job s'exécute SEULEMENT si 'security_scan' a réussi
    needs: security_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Nécessaire pour pousser vers GHCR
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Utilise le GITHUB_TOKEN fourni automatiquement par GitHub
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags for GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- DEPLOIEMENT VIA WEBHOOK COOLIFY (Couvre les options 3a/3b) ---
      - name: Trigger Coolify Deployment Webhook
        if: github.ref == 'refs/heads/main' # Déployer uniquement sur le push vers 'main'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL secret is not set. Skipping Coolify deployment trigger."
          else
            echo "Deployment triggered for app '${{ env.COOLIFY_APP_NAME }}' on Coolify."
            # Envoi d'une requête POST simple pour déclencher le webhook Coolify
            curl -X POST --fail -s -o /dev/null -w "%{http_code}" $COOLIFY_WEBHOOK_URL
          fi