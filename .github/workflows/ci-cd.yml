# Ce workflow est déclenché lors d'un push ou d'une Pull Request sur la branche 'main'.
name: CI/CD Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Définition des variables de l'environnement
env:
  DOCKER_IMAGE_NAME: ${{ github.repository }} # Nom de l'image (e.g., user/repo)
  COOLIFY_APP_NAME: 'votre-application-coolify' # Remplacez par le nom de l'application dans Coolify

jobs:
  ################################################################
  # JOB 1: SECURITY SCAN avec BANDIT
  ################################################################
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        run: |
          echo "Running Bandit security scan..."
          bandit -r . \
            --exclude ./tests \
            --skip B101,B105 \
            --severity-level high \
            --confidence-level high \
            --exit-zero

  ################################################################
  # JOB 2: BUILD DOCKER IMAGE + PUSH GHCR + DEPLOY COOLIFY
  ################################################################
  build_and_deploy:
    needs: security_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags for GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ############################################################
      # DEPLOIEMENT COOLIFY AVEC AUTHENTIFICATION (Coolify v4)
      ############################################################
      - name: Trigger Coolify Deployment Webhook
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL or COOLIFY_API_TOKEN is missing."
            exit 1
          fi

          echo "Triggering deployment on Coolify for '${{ env.COOLIFY_APP_NAME }}'..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$COOLIFY_WEBHOOK_URL")

          echo "Coolify HTTP response: $RESPONSE"

          if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 204 ]; then
            echo "::error::Coolify deployment failed (HTTP $RESPONSE)"
            exit 22
          fi

          echo "✅ Coolify deployment triggered successfully!"
